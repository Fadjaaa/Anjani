<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anjani Nurafni</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;color:#fff}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- LOADER ---------- */
  #loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 45%,#1d1022 0%,#0a0510 55%,#000 100%);transition:opacity .9s ease}
  #loader.done{opacity:0;pointer-events:none}
  .saturn{position:relative;width:40px;height:40px;margin-bottom:46px;animation:bob 3.2s ease-in-out infinite}
  .saturn::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffc98a,#e8873a 58%,#a9501a);box-shadow:0 0 28px rgba(255,150,70,.35)}
  .saturn::after{content:"";position:absolute;left:-17px;top:11px;width:74px;height:20px;border-radius:50%;
    border:4px solid #f0c048;transform:rotate(-10deg);box-shadow:0 0 10px rgba(240,192,72,.35)}
  @keyframes bob{50%{transform:translateY(-6px)}}
  #loader h1{margin:0;font-weight:300;font-size:17px;letter-spacing:.2em;color:#d9d5e8;text-align:center}
  #loader .sub{margin:14px 0 0;font-size:11.5px;color:#c4558a;letter-spacing:.04em}
  #loader .count{margin:16px 0 0;font-size:9.5px;font-style:italic;color:#7d7389}

  /* ---------- HUD ---------- */
  #hud{position:fixed;left:8px;top:8px;z-index:10;pointer-events:none;opacity:0;transition:opacity 1s}
  #hud.show{opacity:1}
  #hud h1{margin:0;font-size:20px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  #hud p{margin:5px 0 0;font-size:10px;font-weight:500;text-shadow:0 1px 6px #000}
  #onlyfor{position:fixed;left:0;right:0;top:3.2%;z-index:10;text-align:center;pointer-events:none;
    font-size:clamp(20px,2.4vw,27px);font-weight:600;opacity:0;transition:opacity .6s;text-shadow:0 2px 14px rgba(0,0,0,.7)}

  /* ---------- PERTANYAAN ---------- */
  #ask{position:fixed;left:50%;top:44%;z-index:20;width:min(92vw,470px);transform:translate(-50%,-50%);
    padding:38px 22px 34px;text-align:center;border-radius:16px;
    background:rgba(13,13,15,.9);border:1px solid rgba(255,255,255,.1);
    box-shadow:0 0 46px rgba(255,100,150,.16),inset 0 0 30px rgba(255,255,255,.015);
    opacity:0;pointer-events:none;transition:opacity .8s, transform .6s}
  #ask.show{opacity:1;pointer-events:auto}
  #ask.hide{opacity:0;pointer-events:none;transform:translate(-50%,-56%) scale(.96)}
  #ask h2{margin:0 0 20px;font-size:clamp(15px,4.2vw,18px);font-weight:700}
  .btnrow{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;min-height:44px}
  .pill{border:0;cursor:pointer;color:#fff;font:600 13px 'Segoe UI',system-ui,sans-serif;padding:11px 22px;border-radius:999px;
    background:linear-gradient(180deg,#f58fa9,#e0668f);box-shadow:0 6px 18px rgba(240,100,140,.32);transition:transform .18s,filter .2s}
  .pill:hover{filter:brightness(1.08)}
  #btnYes:active{transform:scale(.96)}
  #btnNo{position:relative;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}

  /* ---------- TOMBOL KE PIRINGAN ---------- */
  #vinylBtn{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;
    display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;cursor:pointer;
    color:#fff;font:600 13px 'Segoe UI',system-ui,sans-serif;letter-spacing:.02em;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity 1s,background .2s}
  #vinylBtn.show{opacity:1;pointer-events:auto}
  #vinylBtn:hover{background:rgba(255,255,255,.16)}
  #vinylBtn .mini{width:18px;height:18px;border-radius:50%;background:
     radial-gradient(circle,#e0668f 0 22%,#111 23%);border:1px solid #444;animation:spin 3s linear infinite;animation-play-state:paused}
  body.playing #vinylBtn .mini{animation-play-state:running}

  /* ---------- HALAMAN PIRINGAN ---------- */
  #vinyl{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top,0px)) 16px max(18px,env(safe-area-inset-bottom,0px));
    background:
      radial-gradient(1px 1px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 82% 14%,#cfc3ff,transparent),
      radial-gradient(1.5px 1.5px at 66% 78%,#fff,transparent),radial-gradient(1px 1px at 28% 84%,#ffc7dc,transparent),
      radial-gradient(1px 1px at 90% 60%,#fff,transparent),radial-gradient(1px 1px at 8% 62%,#fff,transparent),
      radial-gradient(ellipse at 50% 42%,#2a1030 0%,#0d0612 55%,#030105 100%);
    opacity:0;pointer-events:none;transition:opacity .7s ease}
  #vinyl.open{opacity:1;pointer-events:auto}
  #backBtn{position:absolute;left:14px;top:max(14px,env(safe-area-inset-top,0px));cursor:pointer;color:#fff;
    font:600 13px 'Segoe UI',system-ui,sans-serif;padding:9px 16px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
  #backBtn:hover{background:rgba(255,255,255,.16)}
  .vhead{text-align:center;margin-bottom:26px}
  .vhead small{display:block;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#c4558a}
  .vhead h2{margin:8px 0 2px;font-size:clamp(20px,5vw,26px);font-weight:700}
  .vhead p{margin:0;font-size:13px;color:#b9aec7}

  .deck{--v:min(76vw,52vh,400px);position:relative;width:var(--v);height:var(--v);margin:6px 0 30px}
  .deck::before{content:"";position:absolute;inset:-4%;border-radius:50%;
    background:radial-gradient(circle,rgba(240,100,150,.28),transparent 68%);filter:blur(22px);
    opacity:.55;transition:opacity .8s}
  body.playing .deck::before{opacity:1}
  .disc{position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle,transparent 0 33%,rgba(0,0,0,.35) 33.4%,transparent 35%),
      repeating-radial-gradient(circle at 50% 50%,#0b0b0d 0 1.4px,#18181d 2px 3px);
    box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 3px #1f1f24,inset 0 0 0 2px #2b2b32;
    animation:spin 7s linear infinite;animation-play-state:paused}
  body.playing .disc{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:conic-gradient(from 25deg,transparent 0 16%,rgba(255,255,255,.13) 25%,transparent 34% 66%,rgba(255,255,255,.11) 75%,transparent 84%)}
  .label{position:absolute;left:50%;top:50%;width:37%;height:37%;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff9dbb,#d9588a 60%,#8b2f5b);background-size:cover;background-position:center;
    border:4px solid #0f0f12;box-shadow:0 0 0 2px #e0668f55;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,34px)}
  .label.has-photo{font-size:0}
  .hole{position:absolute;left:50%;top:50%;width:4.2%;height:4.2%;transform:translate(-50%,-50%);border-radius:50%;
    background:#08070a;border:2px solid #cfc6d6;box-shadow:0 0 6px rgba(0,0,0,.8)}

  .arm{position:absolute;right:-17%;top:-9%;width:25%;height:84%;transform-origin:80% 6.5%;transform:rotate(-9deg);
    transition:transform 1.1s cubic-bezier(.45,.05,.25,1);pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}
  body.playing .arm{transform:rotate(15deg)}
  .arm svg{width:100%;height:100%;overflow:visible}

  .controls{width:min(88vw,420px);display:flex;flex-direction:column;align-items:center;gap:16px}
  .bar{width:100%;display:flex;align-items:center;gap:10px;font-size:11px;color:#b9aec7;font-variant-numeric:tabular-nums}
  .track{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.14);cursor:pointer;position:relative}
  .track i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px;background:linear-gradient(90deg,#f58fa9,#e0668f)}
  .track::after{content:"";position:absolute;inset:-9px 0}
  .row{display:flex;align-items:center;gap:22px}
  #playBtn{width:68px;height:68px;border-radius:50%;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;
    background:linear-gradient(180deg,#f58fa9,#e0668f);box-shadow:0 10px 28px rgba(240,100,140,.4);transition:transform .15s}
  #playBtn:hover{transform:scale(1.05)} #playBtn:active{transform:scale(.95)}
  #playBtn svg{width:28px;height:28px;fill:#fff}
  #playBtn .ip{display:none} body.playing #playBtn .ip{display:block} body.playing #playBtn .iplay{display:none}
  .vol{display:flex;align-items:center;gap:8px;font-size:15px}
  .vol input{width:90px;accent-color:#e0668f}

  #toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);z-index:80;max-width:88vw;text-align:center;
    background:rgba(20,16,26,.95);border:1px solid rgba(255,255,255,.15);padding:11px 18px;border-radius:12px;font-size:13px;
    opacity:0;pointer-events:none;transition:.35s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="stage"></div>

<div id="hud">
  <h1>Anjani Nurafni 🤍</h1>
  <p id="hint">Double-tap to trigger the Cinematic Camera Mode.</p>
</div>
<div id="onlyfor">Only For U, <span data-name>Anjani</span> 🤍</div>

<div id="loader">
  <div class="saturn"></div>
  <h1>BUILDING OUR GALAXY</h1>
  <p class="sub">Syncing our beautiful memories...</p>
  <p class="count" id="count">Mengunduh foto (0/0)...</p>
</div>

<div id="ask">
  <h2>Do you wanna see the most prettiest girl in the universe?</h2>
  <div class="btnrow">
    <button class="pill" id="btnYes">Of course 😍</button>
    <button class="pill" id="btnNo">No way 🤪</button>
  </div>
</div>

<button id="vinylBtn"><span class="mini"></span>Vinyl Music</button>

<!-- ========== HALAMAN PIRINGAN MUSIK ========== -->
<section id="vinyl" aria-label="Piringan musik">
  <button id="backBtn">← Galaxy</button>
  <div class="vhead">
    <small>Now Playing</small>
    <h2 id="songTitle">Siapkah Kau'Tuk Jatuh Cinta Lagi</h2>
    <p id="songArtist">Hivi!</p>
  </div>

  <div class="deck">
    <div class="disc">
      <div class="label" id="label">🤍</div>
      <div class="hole"></div>
    </div>
    <div class="sheen"></div>
    <div class="arm">
      <svg viewBox="0 0 100 336" aria-hidden="true">
        <circle cx="80" cy="22" r="17" fill="#2a2a31" stroke="#55555f" stroke-width="3"/>
        <circle cx="80" cy="22" r="6" fill="#8d8d99"/>
        <path d="M80 22 L80 238 L60 288" stroke="#c9c9d4" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="46" y="282" width="26" height="40" rx="5" transform="rotate(24 59 302)" fill="#1d1d23" stroke="#6b6b78" stroke-width="2.5"/>
      </svg>
    </div>
  </div>

  <div class="controls">
    <div class="bar"><span id="tNow">0:00</span><div class="track" id="track"><i id="fill"></i></div><span id="tDur">0:00</span></div>
    <div class="row">
      <button id="playBtn" aria-label="Play / Pause">
        <svg class="iplay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ip" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <label class="vol">🔈<input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    </div>
  </div>
</section>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   ✏️  EDIT BAGIAN INI SAJA
   ===================================================================== */
const NAME = "Anjani";            // nama yang tampil di judul

// Foto-foto untuk galaksi (taruh file di folder yang sama dengan index.html).
// Kalau kosong, galaksi pakai foto contoh warna-warni.
const PHOTOS = [
  "A0.png",
  "A1.jpeg",
  "A2.jpeg",
  "A3.jpeg",
  "A4.jpeg",
];

const CENTER_PHOTO = "A0.png";   // foto di tengah piringan
const MUSIC_SRC    = "A.mp3";
const SONG_TITLE   = "Siapkah Kau'Tuk Jatuh Cinta Lagi";
const SONG_ARTIST  = "Hivi!";
const AUTOPLAY_ON_ENTER = false;            // true = musik langsung putar saat klik "Of course"
/* ===================================================================== */

(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const lerp = (a,b,t) => a+(b-a)*t;
const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || innerWidth < 700;

document.querySelectorAll('[data-name]').forEach(e => e.textContent = NAME);
document.title = `My Lovely ${NAME} 🤍`;
$('#songTitle').textContent = SONG_TITLE;
$('#songArtist').textContent = SONG_ARTIST;

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 3800);
}

/* =====================================================================
   PIRINGAN MUSIK
   ===================================================================== */
let vinylOpen = false;
const audio = new Audio();
audio.loop = false; audio.preload = 'metadata';
if (MUSIC_SRC) audio.src = MUSIC_SRC;
audio.volume = 0.8;

// foto tengah piringan
(function(){
  if(!CENTER_PHOTO) return;
  const im = new Image();
  im.onload = () => { const l=$('#label'); l.style.backgroundImage=`url("${CENTER_PHOTO}")`; l.classList.add('has-photo'); };
  im.onerror = () => { const l=$('#label'); l.style.backgroundImage='none'; l.classList.remove('has-photo'); l.textContent='🤍'; };
  im.src = CENTER_PHOTO;
})();

function fmt(s){ if(!isFinite(s)) return '0:00'; const m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function playMusic(){
  if(!MUSIC_SRC){ toast('Musik belum ditambahkan — isi MUSIC_SRC di index.html'); return; }
  audio.play().catch(()=>toast('File musik tidak bisa diputar — cek nama & lokasi file-nya'));
}
$('#playBtn').addEventListener('click', () => audio.paused ? playMusic() : audio.pause());
audio.addEventListener('play',  () => document.body.classList.add('playing'));
audio.addEventListener('pause', () => document.body.classList.remove('playing'));
audio.addEventListener('error', () => {
  if (MUSIC_SRC && audio.error && audio.error.code !== 1) toast('File musik tidak bisa dimuat: '+MUSIC_SRC);
});
audio.addEventListener('loadedmetadata', () => $('#tDur').textContent = fmt(audio.duration));
audio.addEventListener('timeupdate', () => {
  $('#tNow').textContent = fmt(audio.currentTime);
  $('#fill').style.width = (audio.duration ? audio.currentTime/audio.duration*100 : 0)+'%';
});
$('#track').addEventListener('click', e => {
  if(!isFinite(audio.duration)) return;
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = clamp((e.clientX-r.left)/r.width,0,1)*audio.duration;
});
$('#vol').addEventListener('input', e => audio.volume = +e.target.value);
$('#vinylBtn').addEventListener('click', () => { vinylOpen = true;  $('#vinyl').classList.add('open'); });
$('#backBtn').addEventListener('click',  () => { vinylOpen = false; $('#vinyl').classList.remove('open'); });

/* =====================================================================
   FOTO (loading + atlas)
   ===================================================================== */
const TW = 192, TH = 144, ATLAS = 2048, COLS = Math.floor(ATLAS/TW), ROWS = Math.floor(ATLAS/TH);
const MAX_TILES = COLS*ROWS;

function loadImage(src){
  return new Promise(res => { const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
}
function drawCover(ctx,img,x,y,w,h){
  const s = Math.max(w/img.width, h/img.height), dw=img.width*s, dh=img.height*s;
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh); ctx.restore();
}
function placeholder(i){
  const c=document.createElement('canvas'); c.width=TW; c.height=TH; const g=c.getContext('2d');
  const h=(i*47+200)%360, gr=g.createLinearGradient(0,0,TW,TH);
  gr.addColorStop(0,`hsl(${h},55%,62%)`); gr.addColorStop(1,`hsl(${(h+50)%360},60%,38%)`);
  g.fillStyle=gr; g.fillRect(0,0,TW,TH);
  g.fillStyle='rgba(255,255,255,.88)'; g.font='54px serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('♥',TW/2,TH/2+3);
  return c;
}
function buildAtlas(tiles){
  const c=document.createElement('canvas'); c.width=c.height=ATLAS; const g=c.getContext('2d');
  g.fillStyle='#222'; g.fillRect(0,0,ATLAS,ATLAS);
  tiles.forEach((t,i)=>{
    const x=(i%COLS)*TW, y=Math.floor(i/COLS)*TH;
    if(t instanceof HTMLCanvasElement) g.drawImage(t,x,y,TW,TH); else drawCover(g,t,x,y,TW,TH);
  });
  return c;
}
function tainted(c){ try{ c.getContext('2d').getImageData(0,0,1,1); return false; }catch(e){ return true; } }
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function loadPhotos(){
  const list = PHOTOS.slice(0, MAX_TILES);
  const total = list.length || 24;
  const label = $('#count');
  label.textContent = `Mengunduh foto (0/${total})...`;
  const tiles = [];
  if(list.length){
    let done = 0;
    await Promise.all(list.map(async (src,i) => {
      const im = await loadImage(src);
      tiles[i] = im || placeholder(i);
      label.textContent = `Mengunduh foto (${++done}/${total})...`;
    }));
  } else {
    for(let i=0;i<total;i++){ tiles.push(placeholder(i)); label.textContent=`Mengunduh foto (${i+1}/${total})...`; await sleep(45); }
  }
  let atlas = buildAtlas(tiles);
  if(tainted(atlas)){
    toast('Foto diblokir browser (file://). Jalankan lewat server lokal — lihat README.txt');
    const ph = tiles.map((_,i)=>placeholder(i)); atlas = buildAtlas(ph);
  }
  return { atlas, count: tiles.length };
}

/* =====================================================================
   GALAKSI (Three.js)
   ===================================================================== */
function startGalaxy({atlas,count}){
  const stage = $('#stage');
  const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
  const dpr = Math.min(window.devicePixelRatio||1, mobile?1.5:2);
  renderer.setPixelRatio(dpr); renderer.setClearColor(0x000000,1);
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const FOV = 55;
  const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 9000);
  const U = { uTime:{value:0}, uScale:{value:600} };

  /* --- bintang latar --- */
  {
    const n = mobile?2500:5000, pos=new Float32Array(n*3), col=new Float32Array(n*3), c=new THREE.Color();
    const pal=[0xffffff,0xffffff,0xbfd0ff,0xd9b8ff,0xffc2dc,0xfff0c8];
    for(let i=0;i<n;i++){
      const r=2000+Math.random()*2600, a=Math.random()*6.2832, b=Math.acos(2*Math.random()-1);
      pos.set([r*Math.sin(b)*Math.cos(a), r*Math.cos(b), r*Math.sin(b)*Math.sin(a)], i*3);
      c.setHex(pal[(Math.random()*pal.length)|0]).multiplyScalar(.45+Math.random()*.55); col.set([c.r,c.g,c.b], i*3);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('color',new THREE.BufferAttribute(col,3));
    const m=new THREE.PointsMaterial({size:1.7,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.95,depthWrite:false});
    const p=new THREE.Points(g,m); p.frustumCulled=false; scene.add(p);
  }

  /* --- kotak warna melayang --- */
  {
    const n = mobile?28:55, pos=new Float32Array(n*3), cl=new Float32Array(n*3), sz=new Float32Array(n), ph=new Float32Array(n*3), c=new THREE.Color();
    const pal=[0xb455c8,0x8a4fd6,0xe86aa8,0x6a5acd,0xc9a0f0];
    for(let i=0;i<n;i++){
      const r=260+Math.random()*1300, a=Math.random()*6.2832;
      pos.set([Math.cos(a)*r,(Math.random()-.5)*900,Math.sin(a)*r],i*3);
      c.setHex(pal[(Math.random()*pal.length)|0]); cl.set([c.r,c.g,c.b],i*3);
      sz[i]=3+Math.random()*13; ph.set([Math.random()*9,Math.random()*9,Math.random()*9],i*3);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('aColor',new THREE.BufferAttribute(cl,3));
    g.setAttribute('aSize',new THREE.BufferAttribute(sz,1)); g.setAttribute('aPh',new THREE.BufferAttribute(ph,3));
    const m=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,
      vertexShader:`attribute vec3 aColor; attribute float aSize; attribute vec3 aPh; uniform float uTime,uScale; varying vec3 vC; varying float vA;
        void main(){ vec3 p=position+vec3(sin(uTime*.15+aPh.x),sin(uTime*.12+aPh.y),cos(uTime*.1+aPh.z))*45.0;
          vec4 mv=viewMatrix*vec4(p,1.0); gl_Position=projectionMatrix*mv;
          gl_PointSize=clamp(aSize*uScale/max(-mv.z,1.0),2.0,34.0); vC=aColor; vA=.55+.45*sin(uTime*.8+aPh.x*3.0); }`,
      fragmentShader:`varying vec3 vC; varying float vA; void main(){ gl_FragColor=vec4(vC,vA); }`});
    const p=new THREE.Points(g,m); p.frustumCulled=false; scene.add(p);
  }

  /* --- debu putih (cakram dalam) --- */
  {
    const n = mobile?14000:30000;
    const aA=new Float32Array(n*4), aS=new Float32Array(n), z=new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const r=34+Math.pow(Math.random(),.75)*108;
      const g=(Math.random()+Math.random()+Math.random()-1.5)*5;
      aA.set([r,Math.random()*6.2832,g,26/Math.pow(r,1.5)],i*4); aS[i]=.7+Math.random()*1.3;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(z,3));
    geo.setAttribute('aA',new THREE.BufferAttribute(aA,4)); geo.setAttribute('aS',new THREE.BufferAttribute(aS,1));
    const m=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,
      vertexShader:`attribute vec4 aA; attribute float aS; uniform float uTime,uScale; varying float vT;
        void main(){ float a=aA.y+uTime*aA.w; vec3 p=vec3(cos(a)*aA.x,aA.z,sin(a)*aA.x);
          vec4 mv=viewMatrix*vec4(p,1.0); gl_Position=projectionMatrix*mv;
          gl_PointSize=clamp(aS*uScale/max(-mv.z,1.0),1.0,5.0); vT=.55+.45*sin(uTime*2.0+aA.y*40.0); }`,
      fragmentShader:`varying float vT; void main(){ float d=length(gl_PointCoord-.5); if(d>.5) discard; gl_FragColor=vec4(vec3(1.0),.9*vT); }`});
    const p=new THREE.Points(geo,m); p.frustumCulled=false; scene.add(p);
  }

  /* --- bola merah di tengah --- */
  {
    const n = mobile?3500:7500, pos=new Float32Array(n*3), R=24;
    for(let i=0;i<n;i++){
      const y=1-2*(i+.5)/n, r=Math.sqrt(1-y*y), a=i*2.399963;
      pos.set([Math.cos(a)*r*R,y*R,Math.sin(a)*r*R],i*3);
    }
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const m=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
      vertexShader:`uniform float uTime,uScale;
        void main(){ float c=cos(uTime*.18),s=sin(uTime*.18); vec3 p=position;
          p=vec3(p.x*c+p.z*s,p.y,-p.x*s+p.z*c);
          float beat=pow(max(0.0,sin(uTime*2.4)),8.0)*.07; p*=1.0+beat;
          vec4 mv=viewMatrix*vec4(p,1.0); gl_Position=projectionMatrix*mv;
          gl_PointSize=clamp(1.9*uScale/max(-mv.z,1.0),1.0,4.5); }`,
      fragmentShader:`void main(){ float d=length(gl_PointCoord-.5); if(d>.5) discard; gl_FragColor=vec4(1.0,.13,.2,.85); }`});
    const p=new THREE.Points(geo,m); p.frustumCulled=false; scene.add(p);
  }

  const sunClickTarget = new THREE.Mesh(
    new THREE.SphereGeometry(34,16,12),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false})
  );
  scene.add(sunClickTarget);

  /* --- kartu foto (instanced) --- */
  {
    const N = mobile?1700:3600;
    const aA=new Float32Array(N*4), aB=new Float32Array(N*4);
    for(let i=0;i<N;i++){
      const r=128+Math.pow(Math.random(),.85)*205;
      aA.set([r,Math.random()*6.2832,(Math.random()-.5)*(12+r*.035),60/Math.pow(r,1.5)],i*4);
      aB.set([6+Math.random()*5,(Math.random()-.5)*.9,i%count,Math.random()],i*4);
    }
    const geo=new THREE.InstancedBufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-.5,-.5,0,.5,-.5,0,.5,.5,0,-.5,.5,0]),3));
    geo.setAttribute('uv',new THREE.BufferAttribute(new Float32Array([0,0,1,0,1,1,0,1]),2));
    geo.setIndex([0,1,2,0,2,3]);
    geo.setAttribute('aA',new THREE.InstancedBufferAttribute(aA,4));
    geo.setAttribute('aB',new THREE.InstancedBufferAttribute(aB,4));
    geo.instanceCount=N;
    const tex=new THREE.CanvasTexture(atlas);
    tex.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
    const m=new THREE.ShaderMaterial({
      uniforms:{uTime:U.uTime,uMap:{value:tex},uTile:{value:new THREE.Vector2(TW/ATLAS,TH/ATLAS)},uCols:{value:COLS}},
      side:THREE.DoubleSide,
      vertexShader:`attribute vec4 aA; attribute vec4 aB; uniform float uTime,uCols; uniform vec2 uTile;
        varying vec2 vUv; varying float vFog;
        void main(){
          float a=aA.y+uTime*aA.w;
          vec3 c=vec3(cos(a)*aA.x, aA.z+sin(uTime*.3+aB.w*20.0)*1.5, sin(a)*aA.x);
          float yaw=atan(-cos(a),-sin(a))+(aB.w-.5)*1.5, tl=aB.y;
          vec3 p=position; p.x*=1.333; p*=aB.x;
          p=vec3(p.x, p.y*cos(tl)-p.z*sin(tl), p.y*sin(tl)+p.z*cos(tl));
          p=vec3(p.x*cos(yaw)+p.z*sin(yaw), p.y, -p.x*sin(yaw)+p.z*cos(yaw));
          vec4 mv=viewMatrix*vec4(c+p,1.0); gl_Position=projectionMatrix*mv;
          float col=mod(aB.z,uCols), row=floor(aB.z/uCols); vec2 q=uv*.96+.02;
          vUv=vec2((col+q.x)*uTile.x, 1.0-(row+1.0)*uTile.y+q.y*uTile.y);
          vFog=clamp(1.3-(-mv.z)/1000.0,.35,1.0);
        }`,
      fragmentShader:`uniform sampler2D uMap; varying vec2 vUv; varying float vFog;
        void main(){ vec3 t=texture2D(uMap,vUv).rgb; float g=dot(t,vec3(.3,.59,.11));
          gl_FragColor=vec4(mix(vec3(g),t,.78)*vFog*.92,1.0); }`
    });
    const mesh=new THREE.Mesh(geo,m); mesh.frustumCulled=false; scene.add(mesh);
  }

  /* --- ukuran layar --- */
  function resize(){
    const w=innerWidth,h=innerHeight;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
    U.uScale.value = (h*dpr)/(2*Math.tan(FOV*Math.PI/360));
  }
  addEventListener('resize',resize); resize();

  /* --- kontrol kamera --- */
  const S = { th:.6, ph:1.2, r:1500, tTh:.6, tPh:1.2, tR:1500, intro:false, introT:0, entered:false,
              cin:0, cinT:0, cinTarget:0, cinA0:0 };
  const el = renderer.domElement, ptrs = new Map();
  const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  function clickedSun(x,y){
    pointer.set(x/innerWidth*2-1, -(y/innerHeight)*2+1);
    raycaster.setFromCamera(pointer,camera);
    return raycaster.intersectObject(sunClickTarget,false).length>0;
  }
  let dragging=false, moved=0, pinch=0, lastTap={t:0,x:0,y:0};
  el.addEventListener('pointerdown',e=>{ el.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    dragging=true; moved=0; pinch=0; });
  el.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(ptrs.size===2){
      const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch&&!S.intro) S.tR=clamp(S.tR*pinch/d,80,2200); pinch=d; moved=99;
    } else {
      moved+=Math.abs(dx)+Math.abs(dy);
      S.tTh-=dx*.005; S.tPh=clamp(S.tPh-dy*.005,.12,3.0);
    }
  });
  const up=e=>{
    if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); pinch=0;
    if(ptrs.size===0){
      dragging=false;
      if(moved<8 && S.entered){
        if(clickedSun(e.clientX,e.clientY)){
          toast('Kalau Lulus Garuda Nanti Fotbar Yu?');
          lastTap.t=0;
          return;
        }
        const now=performance.now();
        if(now-lastTap.t<330 && Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<30){ toggleCinematic(); lastTap.t=0; }
        else lastTap={t:now,x:e.clientX,y:e.clientY};
      }
    }
  };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{ e.preventDefault(); if(!S.intro) S.tR=clamp(S.tR*Math.exp(e.deltaY*.0012),80,2200); },{passive:false});

  function toggleCinematic(){
    S.cinTarget = S.cinTarget?0:1;
    if(S.cinTarget) S.cinA0 = S.th - S.cinT*.1;
    $('#hint').textContent = S.cinTarget ? 'Double-tap again to exit Cinematic Camera Mode.' : 'Double-tap to trigger the Cinematic Camera Mode.';
  }

  /* --- masuk galaksi (setelah klik "Of course") --- */
  window.__enterGalaxy = () => { S.entered=true; S.intro=true; S.introT=0;
    $('#onlyfor').style.opacity=1; $('#vinylBtn').classList.add('show'); };

  /* --- loop --- */
  const look=new THREE.Vector3(), pos=new THREE.Vector3(), tmpL=new THREE.Vector3(), tmpP=new THREE.Vector3();
  let last=performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min((now-last)/1000,.05); last=now;
    if(vinylOpen) return;
    U.uTime.value += dt;

    if(S.intro){
      S.introT=Math.min(1,S.introT+dt/3.4);
      const k=1-Math.pow(1-S.introT,3);
      S.tR=lerp(1500,560,k); S.tTh+=dt*(1-k)*.5;
      if(S.introT>=1) S.intro=false;
    }
    if(!dragging && !S.cinTarget) S.tTh+=dt*.03;
    const f=1-Math.exp(-dt*7);
    S.th+=(S.tTh-S.th)*f; S.ph+=(S.tPh-S.ph)*f; S.r+=(S.tR-S.r)*f;

    S.cin+=(S.cinTarget-S.cin)*(1-Math.exp(-dt*1.4));
    if(S.cin>.002) S.cinT+=dt;

    pos.set(Math.sin(S.ph)*Math.cos(S.th)*S.r, Math.cos(S.ph)*S.r, Math.sin(S.ph)*Math.sin(S.th)*S.r);
    look.set(0,0,0);
    if(S.cin>.002){
      const a=S.cinA0+S.cinT*.1, R=185+55*Math.sin(S.cinT*.23), h=16+14*Math.sin(S.cinT*.31+1);
      tmpP.set(Math.cos(a)*R, h, Math.sin(a)*R); tmpL.set(0,8+4*Math.sin(S.cinT*.4),0);
      const e=S.cin*S.cin*(3-2*S.cin);
      pos.lerp(tmpP,e); look.lerp(tmpL,e);
    }
    camera.position.copy(pos); camera.lookAt(look);

    const near=clamp(1-(S.r-220)/520,0,1), vis=S.entered ? Math.max(S.cin, .4+.6*near) : 0;
    $('#onlyfor').style.opacity = vis.toFixed(2);

    renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
   ALUR: loading → pertanyaan → galaksi
   ===================================================================== */
const ask = $('#ask'), btnNo = $('#btnNo');
let nx=0, ny=0;
function dodge(){
  const r=btnNo.getBoundingClientRect(), bx=r.left-nx, by=r.top-ny, m=12;
  for(let i=0;i<12;i++){
    const x=(Math.random()*2-1)*Math.min(innerWidth*.38,190), y=(Math.random()*2-1)*80;
    if(bx+x>m && bx+x+r.width<innerWidth-m && by+y>m && by+y+r.height<innerHeight-m){ nx=x; ny=y; break; }
  }
  btnNo.style.transform=`translate(${nx}px,${ny}px)`;
}
btnNo.addEventListener('pointerenter',dodge);
btnNo.addEventListener('pointerdown',e=>{ e.preventDefault(); dodge(); });
btnNo.addEventListener('click',e=>{ e.preventDefault(); dodge(); });

$('#btnYes').addEventListener('click',()=>{
  ask.classList.add('hide');
  if(AUTOPLAY_ON_ENTER) playMusic();
  if(window.__enterGalaxy) window.__enterGalaxy();
});

(async function boot(){
  const t0=performance.now();
  const data = await loadPhotos();
  if(!window.THREE){
    $('#loader h1').textContent='GAGAL MEMUAT 3D';
    $('#loader .sub').textContent='Pastikan internet aktif lalu refresh halaman.';
    return;
  }
  startGalaxy(data);
  await sleep(Math.max(0,1500-(performance.now()-t0)));
  $('#loader').classList.add('done');
  $('#hud').classList.add('show');
  setTimeout(()=>ask.classList.add('show'),500);
})();
})();
</script>
